<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow mt-8">
  <h2 class="mb-4 text-2xl font-bold text-gray-900">
    Lista de Registros - Cinépolis
  </h2>

  <form
    [formGroup]="formulario"
    *ngIf="editando"
    class="mb-8 p-4 bg-gray-50 rounded-lg border"
  >
    <h3 class="text-lg font-bold mb-4 text-gray-800">Editar Registro</h3>

    <div class="mb-4">
      <label class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
      <input
        type="text"
        formControlName="nombre"
        class="bg-white border border-gray-300 text-sm rounded-lg block w-full p-2.5"
      />
    </div>

    <div class="mb-4">
      <label class="block mb-2 text-sm font-medium text-gray-900"
        >Cantidad de Compradores</label
      >
      <input
        type="number"
        formControlName="compradores"
        class="bg-white border border-gray-300 text-sm rounded-lg block w-full p-2.5"
      />
    </div>

    <div class="mb-4">
      <label class="block mb-2 text-sm font-medium text-gray-900"
        >Tarjeta CINECO</label
      >
      <div class="flex gap-4 items-center">
        <label
          ><input
            type="radio"
            name="tarjeta"
            [value]="true"
            formControlName="tarjeta"
          />
          Sí</label
        >
        <label
          ><input
            type="radio"
            name="tarjeta"
            [value]="false"
            formControlName="tarjeta"
          />
          No</label
        >
      </div>
    </div>

    <div class="mb-4">
      <label class="block mb-2 text-sm font-medium text-gray-900"
        >Cantidad de Boletos</label
      >
      <input
        type="number"
        formControlName="boletos"
        class="bg-white border border-gray-300 text-sm rounded-lg block w-full p-2.5"
      />
    </div>

    <div class="flex gap-3">
      <button
        type="button"
        (click)="guardarEdicion()"
        class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5"
      >
        Actualizar
      </button>
      <button
        type="button"
        (click)="cancelarEdicion()"
        class="text-gray-700 bg-gray-200 hover:bg-gray-300 font-medium rounded-lg text-sm px-5 py-2.5"
      >
        Cancelar
      </button>
    </div>
  </form>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500">
      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">Nombre</th>
          <th scope="col" class="px-6 py-3">Compradores</th>
          <th scope="col" class="px-6 py-3">Tarjeta</th>
          <th scope="col" class="px-6 py-3">Boletos</th>
          <th scope="col" class="px-6 py-3">Valor a Pagar</th>
          <th scope="col" class="px-6 py-3">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let item of cliente; let i = index"
          class="bg-white border-b hover:bg-gray-50"
        >
          <td class="px-6 py-4 font-medium text-gray-900">{{ item.nombre }}</td>
          <td class="px-6 py-4">{{ item.compradores }}</td>
          <td class="px-6 py-4">{{ item.tarjeta ? 'Sí' : 'No' }}</td>
          <td class="px-6 py-4">{{ item.boletos }}</td>
          <td class="px-6 py-4 font-semibold text-green-600">
            ${{ item.valorPagar }}
          </td>
          <td class="px-6 py-4">
            <div class="flex gap-2">
              <button
                type="button"
                class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700"
                (click)="editarCliente(i)"
              >
                Editar
              </button>
              <button
                type="button"
                class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700"
                (click)="eliminarCliente(i)"
              >
                Eliminar
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div
    *ngIf="cliente.length === 0"
    class="p-4 mt-4 text-sm text-gray-800 rounded-lg bg-gray-100"
    role="alert"
  >
    <span class="font-medium">Información:</span> No hay registros guardados.
  </div>
</div>
