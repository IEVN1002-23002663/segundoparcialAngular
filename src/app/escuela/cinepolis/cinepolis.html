<div class="max-w-2xl mx-auto p-6 bg-gray rounded-lg shadow">

  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Cinépolis
  </h1>

  <form [formGroup]="formulario">

    <!-- Nombre -->
    <div class="mb-5">

      <label
        for="nombre"
        class="block mb-2 text-sm font-medium text-gray-900">
        Nombre
      </label>

      <input
        type="text"
        id="nombre"
        name="nombre"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre">

    </div>

    <!-- Cantidad de compradores -->
    <div class="mb-5">

      <label
        for="compradores"
        class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad de Compradores
      </label>

      <input
        type="number"
        id="compradores"
        name="compradores"
        formControlName="compradores"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Cantidad de compradores">

    </div>

    <!-- Tarjeta CINECO -->
    <div class="mb-5">

      <label
        class="block mb-2 text-sm font-medium text-gray-900">
        Tarjeta CINECO
      </label>

      <input
        type="radio"
        id="si"
        name="tarjeta"
        [value]="true"
        formControlName="tarjeta">

      <label for="si">
        Sí
      </label>

      <input
        type="radio"
        id="no"
        name="tarjeta"
        [value]="false"
        formControlName="tarjeta">

      <label for="no">
        No
      </label>

    </div>

    <!-- Cantidad de boletos -->
    <div class="mb-5">

      <label
        for="boletos"
        class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad de Boletos
      </label>

      <input
        type="number"
        id="boletos"
        name="boletos"
        formControlName="boletos"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Ingresar cantidad de boletos">

    </div>

    <!-- Botón -->
    <div class="flex justify-end mt-5">

      <button
        type="button"
        (click)="muestraCinepolis()"
        class="text-white bg-gradient-to-r from-cyan-500 to-blue-500 hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-cyan-300 dark:focus:ring-cyan-800 font-medium rounded-base text-sm px-4 py-2.5 text-center leading-5">
        Procesar
      </button>

    </div>
    <div class="flex justify-end mt-5">

      <button
      type="button" class="text-white bg-gradient-to-r from-cyan-500 to-blue-500 hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-cyan-300 dark:focus:ring-cyan-800 font-medium rounded-base text-sm px-4 py-2.5 text-center leading-5">
      Salir
      </button>

    </div>

  </form>

  <!-- Salida -->
  <h1 class="text-2xl font-bold mt-6 mb-4">
    Salida
  </h1>

  <h2>
    Valor a Pagar: ${{nuevoCinepolis.valorPagar}}
  </h2>

  <h2>
    Nombre: {{nuevoCinepolis.nombre}}
  </h2>

  <h2>
    Compradores: {{nuevoCinepolis.compradores}}
  </h2>

  <h2>
    Tarjeta: {{nuevoCinepolis.tarjeta ? 'Sí' : 'No'}}
  </h2>

  <h2>
    Número de Boletos: {{nuevoCinepolis.boletos}}
  </h2>

</div>
